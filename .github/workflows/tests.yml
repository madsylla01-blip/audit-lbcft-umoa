name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Contrôle de style
        run: ruff check .
      - name: Tests
        run: pytest -q
